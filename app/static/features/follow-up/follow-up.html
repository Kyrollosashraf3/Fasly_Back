<div class="page-head">
  <div class="crumb"><a href="#/home">Classes</a> / <a data-crumb-class href="#">Class</a></div>
  <h1>Follow Up</h1>
  <p class="sub">Weekly follow-up of teachers with their boys.</p>
</div>
<div class="toolbar">
  <div class="toolbar-group">
    <select class="input" id="fu-teacher" aria-label="Teacher"></select>
    <label class="date-field">Date
      <input class="input" id="fu-date" type="date" />
    </label>
  </div>
  <div class="toolbar-group">
    <input class="input search-input" id="fu-search" type="search" placeholder="Search boys..." autocomplete="off" />
  </div>
</div>
<div id="fu-content"></div>
<div class="summary-bar" id="fu-summary" hidden>
  <div class="counts"><span id="fu-count" class="muted small"></span></div>
  <button class="btn btn-primary" id="fu-save">Save Follow Ups</button>
</div>
<h2 class="section-title">History</h2>
<div class="toolbar">
  <div class="toolbar-group">
    <input class="input" id="fu-hist-date" type="date" aria-label="Filter history by date" />
    <button class="btn btn-secondary btn-sm" id="fu-hist-clear">Clear filter</button>
  </div>
</div>
<div id="fu-history"></div>
