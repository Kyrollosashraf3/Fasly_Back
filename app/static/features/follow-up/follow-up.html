<div class="page-head">
  <div class="crumb"><a href="#/home">الفصول</a> / <a data-crumb-class href="#">الفصل</a></div>
  <h1>الافتقاد الأسبوعي</h1>
  <p class="sub">متابعة الخدام للأولاد خلال الأسبوع (مكالمة، زيارة منزل، واتساب).</p>
</div>
<div class="toolbar">
  <div class="toolbar-group">
    <select class="input" id="fu-teacher" aria-label="الخادم"></select>
    <label class="date-field">التاريخ
      <input class="input" id="fu-date" type="date" />
    </label>
  </div>
  <div class="toolbar-group">
    <input class="input search-input" id="fu-search" type="search" placeholder="ابحث بالاسم..." autocomplete="off" />
  </div>
</div>
<div id="fu-content"></div>
<div class="summary-bar" id="fu-summary" hidden>
  <div class="counts"><span id="fu-count" class="muted small"></span></div>
  <button class="btn btn-primary" id="fu-save">حفظ الافتقاد</button>
</div>
<h2 class="section-title">السجل السابق</h2>
<div class="toolbar">
  <div class="toolbar-group">
    <input class="input" id="fu-hist-date" type="date" aria-label="فلترة السجل بالتاريخ" />
    <button class="btn btn-secondary btn-sm" id="fu-hist-clear">مسح الفلتر</button>
  </div>
</div>
<div id="fu-history"></div>
