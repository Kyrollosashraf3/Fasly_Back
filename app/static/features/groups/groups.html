<div class="page-head">
  <h1>مجموعتي</h1>
  <p class="sub">توزيع الأولاد على الخدام وعرض كل مجموعة بتفاصيلها.</p>
</div>
<div class="toolbar">
  <div class="toolbar-group">
    <label class="date-field">الفصل
      <select class="input" id="grp-class" aria-label="الفصل"></select>
    </label>
    <label class="date-field">الخادم
      <select class="input" id="grp-teacher" aria-label="الخادم"></select>
    </label>
  </div>
  <div class="toolbar-group">
    <button class="btn btn-secondary" id="grp-export">تنزيل شيت الإكسل</button>
  </div>
</div>

<div class="dash-section">
  <h2>توزيع المجموعات</h2>
  <p class="dash-hint">اختار الخادم ثم علّم على أولاده من غير الموزعين ثم احفظ. أو ارفع شيت التوزيع مرة واحدة.</p>
  <div class="toolbar" style="margin-bottom:12px">
    <div class="toolbar-group">
      <label class="date-field">الخادم
        <select class="input" id="grp-assign-teacher" aria-label="خادم التوزيع"></select>
      </label>
    </div>
    <div class="toolbar-group">
      <button class="btn btn-primary" id="grp-assign-save">حفظ التوزيع</button>
      <button class="btn btn-secondary" id="grp-import">رفع شيت التوزيع</button>
      <input type="file" id="grp-import-file" accept=".xlsx,.xlsm" hidden />
    </div>
  </div>
  <div id="grp-assign-boys"></div>
</div>

<div id="grp-content"></div>
