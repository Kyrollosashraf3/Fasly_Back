<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">FASLY</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your Sunday school classes.</p>
    <div id="login-error"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-mail">Email</label>
        <input class="input" id="login-mail" name="mail" type="email"
               autocomplete="username" required placeholder="you@church.com" />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input class="input" id="login-password" name="password" type="password"
               autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">Login</button>
    </form>
  </div>
</div>
