<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">فصلي</div>
    <h1>مرحبًا بعودتك</h1>
    <p class="muted">سجّل الدخول لإدارة فصول مدارس الأحد.</p>
    <div id="login-error"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-mail">البريد الإلكتروني</label>
        <input class="input" id="login-mail" name="mail" type="email"
                autocomplete="username" required placeholder="you@church.com" dir="ltr" />
      </div>
      <div class="field">
        <label for="login-password">كلمة المرور</label>
        <input class="input" id="login-password" name="password" type="password"
                autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">دخول</button>
    </form>
  </div>
</div>
